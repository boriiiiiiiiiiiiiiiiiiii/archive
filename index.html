<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f3ee"><title>3SKM　1stライブ　アーカイブ</title>
<style>
:root{color-scheme:light;--paper:#f5f3ee;--ink:#252722;--muted:#74766f;--line:#d9d8d1;--accent:#727b65}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;-webkit-font-smoothing:antialiased}.page{width:min(1500px,100%);margin:0 auto;padding:0 clamp(20px,5vw,76px) 72px}header{padding:clamp(34px,6vw,76px) 0 28px;border-bottom:1px solid var(--line);margin-bottom:clamp(24px,4vw,48px)}h1{margin:0;font-family:Georgia,"Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(30px,4vw,48px);font-weight:500;letter-spacing:.08em}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(26px,3vw,44px) clamp(18px,2vw,28px)}.item{min-width:0}.photo{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#e9e7df}.details{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-top:12px}.name{margin:0;font-size:14px;font-weight:500;letter-spacing:.04em}.words{margin:0;color:var(--muted);font-family:Georgia,"Yu Mincho",serif;font-size:13px;letter-spacing:.04em;white-space:nowrap}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.page{padding:0 16px 44px}header{padding-top:32px;margin-bottom:22px}.grid{grid-template-columns:1fr;gap:28px}.photo{aspect-ratio:5/4}}
.slideshow{margin-top:clamp(32px,5vw,60px);margin-bottom:clamp(56px,8vw,100px);padding-top:28px;border-top:1px solid var(--line)}.slide-heading{margin:0 0 20px;font-family:Georgia,"Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(22px,3vw,30px);font-weight:500;letter-spacing:.06em}.slide-frame{position:relative;display:grid;place-items:center;min-height:220px;background:#252722;overflow:hidden}.slide-photo{display:block;width:100%;height:min(68vw,720px);min-height:280px;object-fit:contain;transition:opacity .4s ease;opacity:1}.slide-photo.is-fading{opacity:0}.slide-arrow{position:absolute;z-index:1;top:50%;transform:translateY(-50%);display:grid;place-items:center;width:44px;height:44px;border:1px solid #ffffff99;border-radius:50%;background:#252722aa;color:white;font-size:27px;cursor:pointer}.slide-arrow:hover,.slide-control:hover{background:var(--accent);color:white}.slide-prev{left:16px}.slide-next{right:16px}.slide-meta{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding-top:14px}.slide-number{color:var(--accent);font-size:12px;letter-spacing:.12em}.slide-tools{display:flex;justify-content:flex-end;margin-top:14px}.slide-control{padding:8px 16px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:13px;cursor:pointer}@media(max-width:520px){.slide-frame{min-height:220px}.slide-photo{height:65vw;min-height:220px}.slide-arrow{width:38px;height:38px}.slide-prev{left:10px}.slide-next{right:10px}}
</style></head><body><main class="page"><header><h1>3SKM　1stライブ　アーカイブ</h1></header><section class="slideshow" id="slideshow" aria-label="写真スライドショー">
  <h2 class="slide-heading">スライドショー</h2>
  <div class="slide-frame">
    <button class="slide-arrow slide-prev" id="slide-prev" type="button" aria-label="前の写真">‹</button>
    <img class="slide-photo" id="slide-photo" src="images/01.jpg" alt="01">
    <button class="slide-arrow slide-next" id="slide-next" type="button" aria-label="次の写真">›</button>
  </div>
  <div class="slide-meta"><span class="slide-number" id="slide-number">01 / 05</span></div>
  <div class="slide-tools"><button class="slide-control" id="slide-toggle" type="button">一時停止</button></div>
</section><section class="grid" id="archive" aria-label="写真アーカイブ"></section></main>
<script>
const archive=document.getElementById('archive');const photoWords={1:'いぇーい！！',2:'ｷｬｱーーーー！！！！！',3:'お前だけは',4:'A！B！C！',5:'フーーー！！'};for(let n=1;n<=99;n++){const file=`${String(n).padStart(2,'0')}.jpg`,card=document.createElement('article');card.className='item';card.innerHTML=`<img class="photo" src="images/${file}" alt="${file}" loading="lazy" decoding="async"><div class="details"><h2 class="name">${String(n).padStart(2,'0')}</h2><p class="words">${photoWords[n]||'(ここに言葉)'}</p></div>`;card.querySelector('img').addEventListener('error',()=>card.remove(),{once:true});archive.append(card)}
const slideFiles=Array.from({length:5},(_,i)=>`${String(i+1).padStart(2,'0')}.jpg`);let slideIndex=0;let playing=true;let transitionTimer;const slidePhoto=document.getElementById('slide-photo');const slideNumber=document.getElementById('slide-number');const slideToggle=document.getElementById('slide-toggle');function showSlide(index){slideIndex=(index+slideFiles.length)%slideFiles.length;const targetIndex=slideIndex;const file=slideFiles[targetIndex];slidePhoto.classList.add('is-fading');clearTimeout(transitionTimer);transitionTimer=window.setTimeout(()=>{const preload=new Image();preload.onload=()=>{if(targetIndex!==slideIndex)return;slidePhoto.src=preload.src;slidePhoto.alt=file.replace('.jpg','');slideNumber.textContent=`${String(targetIndex+1).padStart(2,'0')} / ${String(slideFiles.length).padStart(2,'0')}`;requestAnimationFrame(()=>slidePhoto.classList.remove('is-fading'))};preload.onerror=()=>slidePhoto.classList.remove('is-fading');preload.src=`images/${file}`},400)}document.getElementById('slide-prev').addEventListener('click',()=>showSlide(slideIndex-1));document.getElementById('slide-next').addEventListener('click',()=>showSlide(slideIndex+1));slideToggle.addEventListener('click',()=>{playing=!playing;slideToggle.textContent=playing?'一時停止':'再生'});setInterval(()=>{if(playing&&!document.hidden)showSlide(slideIndex+1)},4000);
</script></body></html>
