<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f3ee"><title>アーカイブサイト</title>
<style>
:root{color-scheme:light;--paper:#f5f3ee;--ink:#252722;--muted:#74766f;--line:#d9d8d1;--accent:#727b65}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;-webkit-font-smoothing:antialiased}.page{width:min(1500px,100%);margin:0 auto;padding:0 clamp(20px,5vw,76px) 72px}header{padding:clamp(34px,6vw,76px) 0 28px;border-bottom:1px solid var(--line);margin-bottom:clamp(24px,4vw,48px)}h1{margin:0;font-family:Georgia,"Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(30px,4vw,48px);font-weight:500;letter-spacing:.08em}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(26px,3vw,44px) clamp(18px,2vw,28px)}.item{min-width:0}.photo{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#e9e7df}.details{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-top:12px}.name{margin:0;font-size:14px;font-weight:500;letter-spacing:.04em}.words{margin:0;color:var(--muted);font-family:Georgia,"Yu Mincho",serif;font-size:13px;letter-spacing:.04em;white-space:nowrap}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.page{padding:0 16px 44px}header{padding-top:32px;margin-bottom:22px}.grid{grid-template-columns:1fr;gap:28px}.photo{aspect-ratio:5/4}}
</style></head><body><main class="page"><header><h1>アーカイブサイト</h1></header><section class="grid" id="archive" aria-label="写真アーカイブ"></section></main>
<script>const archive=document.getElementById('archive');for(let n=1;n<=99;n++){const file=`${String(n).padStart(2,'0')}.jpg`,card=document.createElement('article');card.className='item';card.innerHTML=`<img class="photo" src="images/${file}" alt="${file}" loading="lazy" decoding="async"><div class="details"><h2 class="name">${file}</h2><p class="words">(ここに言葉)</p></div>`;card.querySelector('img').addEventListener('error',()=>card.remove(),{once:true});archive.append(card)}</script></body></html>
